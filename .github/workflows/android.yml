name: Build Native Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test native chess engine
        run: |
          mkdir -p /tmp/chess
          javac -d /tmp/chess app/src/main/java/com/mt/chess/Chess.java tests/NativeChessTest.java
          java -cp /tmp/chess com.mt.chess.NativeChessTest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render bundled chess artwork
        run: |
          python -m pip install cairosvg==2.7.1
          python scripts/render_pieces.py
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk MT-Chess.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MT-Chess
          path: MT-Chess.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" MT-Chess.apk --target "$GITHUB_SHA" --title "MT Chess 2.1.0 Native (build ${GITHUB_RUN_NUMBER})" --notes "Refined native UI, castling by tapping king and rook, simultaneous castling animation, piece captures, four board themes, fixed board and undo. Uninstall old build if Android reports a signing mismatch." --latest
