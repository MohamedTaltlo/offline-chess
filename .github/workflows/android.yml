name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk MT-Chess.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MT-Chess
          path: MT-Chess.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" MT-Chess.apk --target "$GITHUB_SHA" --title "MT Chess 1.0.0 (build ${GITHUB_RUN_NUMBER})" --notes "Offline Android APK. Fixed board, undo, local multiplayer and computer." --latest
