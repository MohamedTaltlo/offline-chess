<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self'; connect-src 'none'"><title>MT Chess</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><div class="brand"><div class="logo">♞</div><div><h1>MT Chess</h1><small>شطرنج بلا إنترنت</small></div></div><button id="new" class="primary">＋ مباراة جديدة</button></header>
<div class="meta"><span id="modeLabel"></span><span class="offline">● OFFLINE</span></div>
<div class="layout"><section><div id="black" class="player"><div class="avatar black">♚</div><div><strong id="blackName">الأسود</strong><small id="blackCapt"></small></div><span class="turn">●</span></div>
<div id="board" class="board" dir="ltr" aria-label="رقعة الشطرنج"></div>
<div id="white" class="player"><div class="avatar white">♚</div><div><strong id="whiteName">الأبيض</strong><small id="whiteCapt"></small></div><span class="turn">●</span></div>
<div id="status" class="status" role="status"></div><div class="actions"><button id="undo">↶ تراجع</button><button id="resign">⚑ استسلام</button></div></section>
<aside><div class="panel"><h2>سجل النقلات</h2><div id="history" dir="ltr"></div></div><div class="panel"><label class="check"><input id="hints" type="checkbox" checked> إظهار النقلات المتاحة</label><button id="draw" class="full">تعادل بالاتفاق</button></div></aside></div>
<footer>MT CHESS · 1.0.0</footer></main>
<dialog id="setup"><form id="setupForm"><div class="dialogHead"><h2>مباراة جديدة</h2><button type="button" id="close">✕</button></div><label>طريقة اللعب</label><div class="choices"><label><input type="radio" name="mode" value="cpu" checked><span>♟ ضد الكمبيوتر</span></label><label><input type="radio" name="mode" value="friend"><span>♞ مع صديق 1v1</span></label></div><div id="cpuOptions"><label for="level">المستوى</label><select id="level"><option value="easy">سهل</option><option value="medium" selected>متوسط</option><option value="hard">صعب</option><option value="expert">خبير</option></select><label for="color">لون قطعك</label><select id="color"><option value="w">الأبيض</option><option value="b">الأسود</option><option value="random">عشوائي</option></select></div><button class="primary full" type="submit">ابدأ اللعب</button></form></dialog>
<dialog id="promote"><h2>ترقية البيدق</h2><div id="promotions"></div><button id="cancelPromotion" class="full">إلغاء</button></dialog>
<script src="game.js"></script></body></html>
